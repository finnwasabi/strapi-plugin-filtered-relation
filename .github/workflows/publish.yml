name: Publish to npm

# Chay khi package.json doi tren main, hoac khi bam tay trong tab Actions.
# Buoc kiem ben duoi chi phat hanh khi so phien ban chua ton tai tren npm, nen
# sua mo ta hay phu thuoc roi push cung khong sinh ra lan chay do vo nghia.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # bat buoc, day la thu sinh ra OIDC token cho npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC chi co tu npm 11.5.1, ban di kem Node 22 con cu hon the.
      - run: npm install -g npm@latest

      - id: check
        name: Xem phien ban nay da co tren npm chua
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "goi: $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "da co tren npm, bo qua buoc phat hanh"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "chua co, se phat hanh"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
